# Reusable CI for a Rust package whose behaviour a Gherkin suite tests:
#
#   ci:
#     uses: schryer/pubkit/.github/workflows/rust-ci.yml@vX.Y.Z
#     with: { pub-version: v0.1.1 }
#
# The gates and the functional job run make targets -- pubkit.mk's by
# default, and a repository adds its own (guards, conformance) by naming
# them. The cross-platform job runs cargo directly: macOS ships make 3.81,
# and Windows has no /bin/bash.
name: rust-ci

on:
  workflow_call:
    inputs:
      python-version: { type: string, default: '3.14' }
      apt-packages: { type: string, default: '', description: Extra Ubuntu packages for the functional job. }
      pub-version: { type: string, default: '', description: A publet tag whose pub the functional suite drives; empty installs none. }
      os-matrix: { type: string, default: '["ubuntu-latest", "macos-latest", "windows-latest"]' }
      gates: { type: string, default: fmt-check lint doc, description: "Make targets the gates job runs, in order." }
      test-args: { type: string, default: '', description: Arguments to cargo test on every platform. }
      functional: { type: string, default: functional, description: "Make targets the functional job runs after sync-check, in order." }

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo --version && rustc --version
      - run: |
          for target in $GATES; do
            echo "::group::make $target"; make "$target"; echo "::endgroup::"
          done
        env: { GATES: '${{ inputs.gates }}' }

  test:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo test ${{ inputs.test-args }}

  functional:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '${{ inputs.python-version }}' }
      - if: inputs.apt-packages != ''
        run: sudo apt-get update && sudo apt-get install -y $APT
        env: { APT: '${{ inputs.apt-packages }}' }
      - if: inputs.pub-version != ''
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/pub
          key: pub-${{ inputs.pub-version }}
      - if: inputs.pub-version != ''
        run: |
          command -v pub >/dev/null && pub --version | grep -q "^pub ${PUB#v}$" \
            || cargo install --locked --git https://github.com/schryer/publet --tag "$PUB" publet-cli
        env: { PUB: '${{ inputs.pub-version }}' }
      - run: make venv
      - run: make sync-check
      - run: |
          for target in $FUNCTIONAL; do
            echo "::group::make $target"; make "$target"; echo "::endgroup::"
          done
        env: { FUNCTIONAL: '${{ inputs.functional }}' }
